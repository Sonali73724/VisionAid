services:
  - type: web
    name: visionaid-server
    runtime: python
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
